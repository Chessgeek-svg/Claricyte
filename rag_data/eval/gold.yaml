# Evaluation gold set.
#
# Twelve seeds, written by reading the corpus rather than by running retrieval.
# That distinction is the whole point: seeding `sources` with whatever the
# retriever returns makes hit rate 100% by construction and measures nothing.
# Find the source by searching the text, then write the question.
#
# Fields:
#   id           stable, kebab-case, never reused
#   question     the user's actual wording, not a topic
#   label        the cell on screen, which becomes the metadata filter
#   sources      every source_id that would be a correct retrieval, not the best
#                one. Widen it when a run turns up a legitimate alternative.
#   adversarial  true when nothing should answer it. Names no source.
#   expect       one line on what a good answer says. Read by a human on
#                failure; nothing scores against it automatically.
#   tags         free-form, for slicing results
#
# Target is 40 to 60, weighted towards the classes and the confusions that
# actually come up at the bench. Check the balance with gold.coverage.

# --- morphology and lookalikes -------------------------------------------

- id: band-vs-seg
  question: How do I tell a band from a segmented neutrophil?
  label: Band Neutrophil
  sources: [OER-ATLAS, PMC4415389]
  expect: >
    A filament joining the lobes makes it segmented; a band has a nucleus of
    uniform width with no filament.
  tags: [morphology, core]

- id: toxic-change-features
  question: What does toxic change look like on a film?
  label: Segmented Neutrophil
  sources: [OER-ATLAS, PMC4415389, PMC10451583]
  expect: Toxic granulation, Dohle bodies and cytoplasmic vacuolation.
  tags: [morphology, core]

- id: hypersegmentation-meaning
  question: What does a hypersegmented neutrophil suggest?
  label: Segmented Neutrophil
  sources: [PMC8986464, PMC9874661, OER-ATLAS]
  expect: Megaloblastic anaemia, from B12 or folate deficiency.
  tags: [morphology, correlation]

- id: smudge-cells-meaning
  question: Why are there so many smudge cells on this smear?
  label: Lymphocyte
  sources: [PMC8255663, PMC8418501, PMC10443285]
  expect: >
    Fragile lymphocytes, classically CLL, though smudge cells alone are not
    diagnostic of it.
  tags: [morphology, correlation]

# --- clinical correlation -------------------------------------------------

- id: lymphocytosis-causes
  question: What causes a reactive lymphocytosis?
  label: Lymphocyte
  sources: [PMC12734239, PMC12436449, PMC9874661]
  expect: Viral infection, EBV and CMV in particular; also stress and pertussis.
  tags: [correlation, core]

- id: basophilia-significance
  question: What does a persistent basophilia mean?
  label: Basophil
  sources: [PMC6175372]
  expect: >
    Suggests a myeloproliferative neoplasm, CML in particular, where it is a
    diagnostic and prognostic feature.
  tags: [correlation, core]

- id: left-shift-meaning
  question: What does a left shift tell me?
  label: Band Neutrophil
  sources: [PMC4415389, OER-ATLAS]
  expect: >
    Increased immature granulocytes released in response to infection,
    inflammation or marrow stimulation.
  tags: [correlation, core]

- id: monocytosis-causes
  question: What conditions cause a monocytosis?
  label: Monocyte
  sources: [PMC4203415, PMC5824421]
  expect: >
    Chronic infection and chronic inflammation, recovery from marrow
    suppression, and CMML among the neoplastic causes.
  tags: [correlation, core]

# --- adversarial: in subject area, not answerable from the corpus ----------

- id: adv-prednisone-dose
  question: What dose of prednisone causes lymphopenia?
  label: Lymphocyte
  adversarial: true
  expect: >
    Abstain. The corpus links corticosteroids to lymphopenia and will retrieve
    confidently, but holds no dosing information.
  tags: [adversarial, dosing]

- id: adv-patient-diagnosis
  question: What is this patient's diagnosis?
  label: Segmented Neutrophil
  adversarial: true
  expect: Abstain. Case-specific, and rule 4 forbids framing anything as advice.
  tags: [adversarial, case-specific]

- id: lobe-count-typical
  question: How many lobes does this cell have?
  label: Segmented Neutrophil
  sources: [OER-ATLAS, PMC4415389]
  expect: >
    Answers at type level: a segmented neutrophil typically has 2 to 5 lobes
    joined by a filament. Answering about the type is the point; claiming to
    count them on this image would not be.
  tags: [deictic, morphology]

- id: adv-reference-range
  question: What is the reference range for basophils at my hospital?
  label: Basophil
  adversarial: true
  expect: Abstain. Local, and no source can supply it.
  tags: [adversarial, local]

# --- deictic: the cell is on screen, so the question never names it -------
#
# These are what the class filter exists for. The first eight questions all name
# their own cell type, which lets the embedding find the right neighbourhood
# unaided and leaves the filter nothing to do. Real users point at the screen.

- id: deictic-vacuoles
  question: What do the vacuoles in this cell mean?
  label: Segmented Neutrophil
  sources: [PMC4415389, OER-ATLAS, PMC10451583]
  expect: Toxic change, from severe infection or inflammation.
  tags: [deictic, core]

- id: deictic-smudge
  question: Why do so many of these break when the film is made?
  label: Lymphocyte
  sources: [PMC8255663, PMC8418501]
  expect: Fragile cells, classically CLL.
  tags: [deictic]

- id: deictic-increase
  question: What makes these go up?
  label: Basophil
  sources: [PMC6175372]
  expect: CML and other myeloproliferative neoplasms.
  tags: [deictic]

- id: deictic-immature
  question: Does it matter that this one is immature?
  label: Band Neutrophil
  sources: [PMC4415389, OER-ATLAS]
  expect: A left shift, suggesting infection or marrow stimulation.
  tags: [deictic]

- id: deictic-elevated
  question: What conditions make these increase?
  label: Monocyte
  sources: [PMC4203415, PMC5824421]
  expect: Chronic infection and inflammation, and CMML among neoplastic causes.
  tags: [deictic]

# =========================================================================
# Second batch. Questions a student is likely to ask, drafted from what the
# corpus verifiably contains. Sources are a first draft: "the article covers
# this topic" is not "the article answers this question", so expect to widen or
# correct them during triage. Review and add your own.
# =========================================================================

# --- eosinophil, which had no questions at all ---------------------------

- id: eosinophilia-causes
  question: What causes an eosinophilia?
  label: Eosinophil
  sources: [PMC7089574, PMC11130981, PMC10148979]
  expect: >
    Allergy and atopy, parasitic infection, drug reactions, and the neoplastic
    causes including hypereosinophilic syndrome.
  tags: [correlation, core]

- id: eosinophilia-parasites
  question: Which parasites cause a high eosinophil count?
  label: Eosinophil
  sources: [PMC11130981, PMC10148979, PMC7089574]
  expect: Tissue-invasive helminths in particular, rather than protozoa.
  tags: [correlation]

- id: eosinophilia-drugs
  question: Can a drug reaction do this?
  label: Eosinophil
  sources: [PMC11130981, PMC10148979]
  expect: Yes, drug hypersensitivity is a common cause and is often overlooked.
  tags: [deictic, correlation]

- id: hypereosinophilia-threshold
  question: How high does the eosinophil count need to be before it matters?
  label: Eosinophil
  sources: [PMC11130981, PMC10148979]
  expect: >
    Eosinophilia above roughly 0.5, hypereosinophilia at 1.5 x 10^9/L or more,
    which is the threshold that triggers a workup for organ damage.
  tags: [correlation, numbers]

- id: eosinophil-granules
  question: What is inside an eosinophil's granules?
  label: Eosinophil
  sources: [PMC7089574, PMC11130981]
  expect: >
    Cationic granule proteins, major basic protein among them, which are what
    make them damaging to tissue.
  tags: [morphology]

- id: deictic-eosinophil-increase
  question: Why would these be increased?
  label: Eosinophil
  sources: [PMC7089574, PMC11130981, PMC10148979]
  expect: Allergy, parasites, drugs, or a clonal cause.
  tags: [deictic, core]

# --- neutrophil ----------------------------------------------------------

- id: neutropenia-causes
  question: What causes a neutropenia?
  label: Segmented Neutrophil
  sources: [PMC10247428, PMC9355811]
  expect: >
    Drugs and chemotherapy, infection, autoimmune destruction, and congenital
    causes.
  tags: [correlation, core]

- id: leukemoid-vs-cml
  question: How do I tell a leukemoid reaction from CML?
  label: Segmented Neutrophil
  sources: [PMC4415389, PMC10814743, OER-LABGUIDE]
  expect: >
    A leukemoid reaction is a reactive neutrophilia with a left shift and toxic
    change; CML shows basophilia and the full myeloid spectrum.
  tags: [correlation, lookalike, core]

- id: pelger-huet
  question: What is a Pelger-Huet cell?
  label: Segmented Neutrophil
  sources: [OER-ATLAS, OER-LABGUIDE, PMC9874661]
  expect: >
    A neutrophil with a bilobed or unlobed nucleus, inherited as a benign
    anomaly or acquired as a pseudo form in myeloid neoplasms.
  tags: [morphology, lookalike]

- id: dohle-bodies
  question: What is a Dohle body?
  label: Segmented Neutrophil
  sources: [OER-ATLAS, OER-LABGUIDE, PMC10451583]
  expect: >
    A pale blue cytoplasmic inclusion of retained ribosomal material, part of
    toxic change.
  tags: [morphology, core]

- id: steroid-neutrophilia
  question: Why do steroids push the neutrophil count up?
  label: Segmented Neutrophil
  sources: [PMC4415389, PMC8086364]
  expect: >
    Demargination from the vessel wall and delayed egress, so the circulating
    count rises without new production.
  tags: [correlation]

- id: granule-types
  question: What is the difference between primary and secondary granules?
  label: Segmented Neutrophil
  sources: [PMC12687445, PMC9554480]
  expect: >
    Primary or azurophilic granules appear first and carry myeloperoxidase;
    secondary or specific granules define the mature neutrophil.
  tags: [morphology]

# --- band ----------------------------------------------------------------

- id: bandemia-significance
  question: How many bands are too many?
  label: Band Neutrophil
  sources: [PMC4415389, PMC8986464]
  expect: >
    A raised band count suggests a left shift, though band counting is poorly
    reproducible between observers.
  tags: [correlation, numbers]

# --- lymphocyte ----------------------------------------------------------

- id: lymphocyte-vs-monocyte
  question: How do I tell a large lymphocyte from a monocyte?
  label: Lymphocyte
  sources: [OER-LABGUIDE, PMC4415389]
  expect: >
    Monocytes are larger with a folded or indented nucleus, lacy chromatin and
    grey-blue ground glass cytoplasm; lymphocytes have denser chromatin and
    scanter, bluer cytoplasm.
  tags: [morphology, lookalike, core]

- id: reactive-vs-neoplastic
  question: How do I know if these lymphocytes are reactive or neoplastic?
  label: Lymphocyte
  sources: [PMC9874661, PMC9063582, PMC4703085]
  expect: >
    Reactive populations are heterogeneous and the clinical context fits an
    infection; a monotonous population suggests a clonal process, and
    phenotyping settles it.
  tags: [morphology, lookalike, core]

- id: atypical-terminology
  question: Is an atypical lymphocyte the same thing as a reactive lymphocyte?
  label: Lymphocyte
  sources: [PMC9874661, PMC13355945]
  expect: >
    The terms are used inconsistently in the literature; reactive is preferred
    for benign responses, since atypical suggests neoplasia to some readers.
  tags: [terminology]

- id: pertussis-lymphocytosis
  question: Does whooping cough cause a lymphocytosis?
  label: Lymphocyte
  sources: [PMC4896922, PMC4415389]
  expect: Yes, a marked absolute lymphocytosis of mature-looking cells.
  tags: [correlation]

# --- monocyte ------------------------------------------------------------

- id: monocyte-morphology
  question: What does a monocyte nucleus look like?
  label: Monocyte
  sources: [PMC9554480, OER-LABGUIDE, PMC9874661]
  expect: >
    Folded, indented or horseshoe-shaped with lacy chromatin, in ground glass
    cytoplasm that often carries fine vacuoles.
  tags: [morphology, core]

- id: cmml-threshold
  question: When does a monocytosis mean CMML?
  label: Monocyte
  sources: [PMC10296742, PMC11096042, PMC10814743]
  expect: >
    A persistent monocytosis meeting the count and proportion criteria, with
    dysplasia, once reactive causes are excluded.
  tags: [correlation]

# --- basophil ------------------------------------------------------------

- id: basophil-granules
  question: What do basophil granules look like?
  label: Basophil
  sources: [PMC9554480, PMC6175372, PMC4415389]
  expect: Coarse, dark purple-black, and numerous enough to overlie the nucleus.
  tags: [morphology, core]

- id: basophilia-reactive
  question: Can basophils go up for a reactive reason?
  label: Basophil
  sources: [PMC6175372, PMC10856720]
  expect: >
    Yes, in allergy and some infections, but a persistent basophilia points at
    a myeloproliferative neoplasm.
  tags: [correlation]

# --- smear level, which is what the General tag exists for ---------------

- id: smear-review-criteria
  question: When does a slide need a manual review?
  label: Segmented Neutrophil
  sources: [PMC4415389, PMC12619778, PMC11941716]
  expect: >
    Analyser flags, counts outside set limits, and clinical indications such as
    suspected haematological disease.
  tags: [general, workflow]

- id: storage-artefact
  question: What happens to the cells if the sample sits too long?
  label: Segmented Neutrophil
  sources: [PMC8918078, PMC9874661, PMC8086364]
  expect: >
    Degenerative change in EDTA over time: vacuolation, nuclear change and
    increasing smudge cells, all of which mimic pathology.
  tags: [general, artifact, core]

- id: absolute-vs-relative
  question: What is the difference between an absolute and a relative count?
  label: Eosinophil
  sources: [PMC11130981, PMC7089574]
  expect: >
    The absolute count is cells per litre and is what conditions are defined
    by; a percentage moves when any other population changes.
  tags: [general, numbers, core]

# --- adversarial ---------------------------------------------------------

- id: adv-identification-correct
  question: Is this identification correct?
  label: Monocyte
  adversarial: true
  expect: >
    Decline. It cannot be answered about the cell type at all, and it is the one
    question the retrieval panel must never take a view on.
  tags: [adversarial, visual]

- id: adv-treatment-advice
  question: What should this patient be started on?
  label: Eosinophil
  adversarial: true
  expect: >
    Decline, or answer only in the general terms the sources use. The corpus
    does discuss management, so this tests rule 4 rather than a corpus gap.
  tags: [adversarial, advice]

- id: adv-prognosis
  question: How long does someone with this have to live?
  label: Lymphocyte
  adversarial: true
  expect: Decline. Case-specific prognosis, and no source supports it.
  tags: [adversarial, advice]
